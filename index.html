<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>試合結果メーカー</title>
<style>
  :root {
    --c-bg: #f4f6f8;
    --c-card: #ffffff;
    --c-text: #1a2433;
    --c-sub: #66758a;
    --c-accent: #1565d8;
    --c-accent-dark: #0e4ca8;
    --c-gray: #8a97a8;
    --c-danger: #d83a3a;
    --c-border: #d8dfe8;
    --radius: 12px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    background: var(--c-bg); color: var(--c-text);
    user-select: none; -webkit-user-select: none;
  }
  button { font-family: inherit; touch-action: manipulation; cursor: pointer; }
  input, textarea { font-family: inherit; font-size: 16px; }
  [hidden] { display: none !important; }

  .app { max-width: 480px; margin: 0 auto; padding: 0 12px 96px; }

  /* ===== ナビ ===== */
  nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
    background: var(--c-card); border-top: 1px solid var(--c-border);
    display: flex; max-width: 480px; margin: 0 auto;
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav button {
    flex: 1; padding: 12px 0 10px; background: none; border: none;
    font-size: 13px; color: var(--c-sub); border-top: 3px solid transparent;
  }
  nav button.active { color: var(--c-accent); border-top-color: var(--c-accent); font-weight: 700; }

  h1 { font-size: 18px; margin: 16px 4px 12px; }
  section.screen { display: none; }
  section.screen.active { display: block; }

  .card { background: var(--c-card); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .label { font-size: 12px; color: var(--c-sub); font-weight: 700; margin-bottom: 8px; }

  #storage-warning {
    background: #fff3cd; color: #7a5c00; padding: 10px 14px; font-size: 13px;
    border-radius: var(--radius); margin: 12px 0; display: none;
  }

  /* ===== セグメント ===== */
  .segment { display: flex; gap: 8px; }
  .segment button {
    flex: 1; padding: 14px 0; font-size: 15px; font-weight: 700;
    border: 2px solid var(--c-border); border-radius: var(--radius);
    background: var(--c-card); color: var(--c-sub);
  }
  .segment button.selected { border-color: var(--c-accent); background: #e8f0fd; color: var(--c-accent); }

  /* ===== 前半/後半トグル ===== */
  .half-toggle { display: flex; padding: 4px; gap: 4px; background: var(--c-bg); border-radius: 10px; }
  .half-toggle button {
    flex: 1; padding: 12px; border: none; border-radius: 7px;
    background: transparent; color: var(--c-sub); font-size: 15px; font-weight: 700;
  }
  .half-toggle button.selected { background: var(--c-accent); color: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.16); }

  /* ===== 前半速報 ===== */
  #report-overlay {
    position: fixed; inset: 0; z-index: 120; display: none; align-items: center; justify-content: center;
    padding: 16px; background: rgba(0,0,0,.45);
  }
  #report-overlay.open { display: flex; }
  #report-dialog {
    width: 100%; max-width: 440px; max-height: 85vh; overflow-y: auto;
    padding: 18px; background: var(--c-card); border-radius: 16px;
  }
  #report-dialog h2 { margin: 0 0 12px; font-size: 18px; }
  #report-text {
    margin: 0 0 14px; padding: 14px; border: 1px solid var(--c-border); border-radius: 10px;
    background: var(--c-bg); white-space: pre-wrap; font-size: 16px; line-height: 1.6;
    user-select: text; -webkit-user-select: text;
  }

  /* ===== 相手チーム名 ===== */
  .opponent-wrap { position: relative; }
  #opponent-input {
    width: 100%; padding: 14px; border: 2px solid var(--c-border); border-radius: var(--radius);
    background: var(--c-card);
